# VaultIQ — Security checks
# CodeQL static analysis (JS + Python), dependency review on PRs, weekly full scan.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # Blocks PRs that add dependencies with known high/critical vulnerabilities
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency graph availability
        id: dependency-graph
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const enabled = data.security_and_analysis?.dependency_graph?.status === "enabled";
            core.setOutput("enabled", enabled ? "true" : "false");
            if (!enabled) {
              core.warning("Dependency Graph is disabled or not visible to this token; skipping dependency review.");
            }
      - uses: actions/dependency-review-action@v5
        if: steps.dependency-graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
