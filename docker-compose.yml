

services:
  db:
    image: postgres:15-alpine
    container_name: vaultiq-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vaultiq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vaultiq-net

  redis:
    image: redis:7-alpine
    container_name: vaultiq-redis
    ports:
      - "6379:6379"
    networks:
      - vaultiq-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - backend/.env
    depends_on:
      - db
      - redis
      - ai-service
    networks:
      - vaultiq-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    env_file:
      - backend/.env
    networks:
      - vaultiq-net

  namenode:
    platform: linux/amd64
    image: apache/hadoop:3
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    # Format once on first boot (idempotent: skips if already formatted)
    command: >
      bash -c "
        [ ! -d /hadoop/dfs/name/current ] && hdfs namenode -format -force -nonInteractive;
        hdfs namenode
      "
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "9870:9870"   # NameNode Web UI / WebHDFS
      - "9000:9000"   # HDFS RPC
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - vaultiq-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/webhdfs/v1/?op=LISTSTATUS || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  datanode:
    platform: linux/amd64
    image: apache/hadoop:3
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - vaultiq-net

  spark-master:
    platform: linux/amd64
    image: apache/spark:latest
    container_name: spark-master
    restart: unless-stopped
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8080:8080"   # Spark Web UI
      - "7077:7077"   # Spark master RPC
    volumes:
      - ./backend/scripts/spark-jobs:/opt/spark-jobs  # analytics scripts
    networks:
      - vaultiq-net

  spark-worker:
    platform: linux/amd64
    image: apache/spark:latest
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: "1"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./backend/scripts/spark-jobs:/opt/spark-jobs  # workers need the script too
    networks:
      - vaultiq-net

networks:
  vaultiq-net:
    driver: bridge

volumes:
  postgres_data:
  hadoop_namenode:
  hadoop_datanode:

