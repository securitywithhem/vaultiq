version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - backend/.env
    depends_on:
      - ai-service
    networks:
      - vaultiq-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    env_file:
      - backend/.env
    networks:
      - vaultiq-net

networks:
  vaultiq-net:
    driver: bridge
